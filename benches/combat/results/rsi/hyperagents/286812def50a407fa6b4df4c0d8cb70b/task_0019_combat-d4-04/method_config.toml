[backend.openai]
# Optional fixed credentials. Non-empty values take precedence over the
# environment variables below. Keep api_key empty to use OPENAI_API_KEY.
api_key = "<redacted>"
base_url = "https://llm-proxy.humanlaya.com/v1"
api_key_env = "OPENAI_API_KEY"
base_url_env = "OPENAI_BASE_URL"
api_mode = "responses"

[state]
run_dir = "../../../outputs/hyperagents"
initial_source = ""
reuse_existing = false

[meta_agent]
backend = "openai"
model = "gpt-5.6-luna-r1-staff"
reasoning_effort = "low"
max_output_tokens = 16384

[task_agent]
backend = "openai"
model = "gpt-5.6-luna-r1-staff"
reasoning_effort = "low"
max_output_tokens = 4096

[refine]
max_refinement_rounds = 1
