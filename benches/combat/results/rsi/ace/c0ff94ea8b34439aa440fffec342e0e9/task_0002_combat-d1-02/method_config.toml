[backend.openai]
# Optional fixed credentials. Non-empty values take precedence over the
# environment variables below. Keep api_key empty to use OPENAI_API_KEY.
api_key = "<redacted>"
base_url = "https://llm-proxy.humanlaya.com/v1"
api_key_env = "OPENAI_API_KEY"
base_url_env = "OPENAI_BASE_URL"
api_mode = "responses"
max_output_tokens = 512

[state]
# Empty means ACEAdaptor.init() creates the standard empty playbook.
initial_playbook_path = ""

[agent]
backend = "openai"
model = "gpt-5.6-luna-r1-staff"
api_mode = "responses"
max_output_tokens = 4096
reasoning_effort = "low"
output_format = "json_object"

[reflector]
backend = "openai"
model = "gpt-5.6-luna-r1-staff"
reasoning_effort = "low"

[curator]
backend = "openai"
model = "gpt-5.6-luna-r1-staff"
reasoning_effort = "low"

[refine]
max_output_tokens = 4096
playbook_token_budget = 80000
curator_batch_size = 1
use_json_mode = true
# Enable only when Benchmark explicitly permits ground-truth exposure.
use_ground_truth = false
