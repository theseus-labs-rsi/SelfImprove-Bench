model_name: codex-exec
prompt_template_id: game_agent_template

output_format: |
    - You must call exactly ONE tool per step.
    - The tool name must be a registered action id.
    - Include `reasoning` as a short rationale.
    - Do not output free-form text.

model: "gpt-5.6-sol"
reasoning_effort: "medium"
endpoint: "https://free-router.opendatalab.com/v1"
enable_memory: true
codex_bin: "codex"
sandbox: "read-only"
