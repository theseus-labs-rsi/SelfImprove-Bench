model_name: kimi-code
prompt_template_id: game_agent_template

output_format: |
    - Return exactly one JSON object per step.
    - `tool_name` must be a registered action id.
    - Include `arguments.reasoning` as a short rationale.
    - Do not output free-form text or Markdown fences.

model: "kimi-k3"
kimi_bin: "/usr/local/bin/kimi"
provider_type: "openai"
endpoint: "https://api.example.invalid/v1"
max_context_size: 262144
capabilities: "thinking,tool_use"
disable_telemetry: true
request_timeout: 180.0
retry_backoff_sec: 2.0
retry_max_backoff_sec: 60.0
enable_memory: true
