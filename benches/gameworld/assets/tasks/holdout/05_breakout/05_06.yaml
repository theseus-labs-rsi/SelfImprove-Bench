task_id: "05_06"
game_id: 05_breakout
game_url_suffix: "?level=1"
evaluator_id: game_api_metric
max_steps: 500
task_target_score_field: 1
task_start_score_field: 0
pause_during_inference: true
continue_on_fail: true

task_prompt: |
  Long-horizon quota task: clear every brick in level 1.
  Keep the ball in play, track the paddle and ball from the screen, and adjust left/right rather than waiting when the ball is moving away.

evaluator_config:
  terminal_status: success
  score_field: game_state.completion_progress
  no_progress_patience: 120
  no_progress_min_delta: 0.001
  metrics_fields:
    - game_state.score
    - game_state.completion_progress
    - game_state.level
    - metrics.lives
    - metrics.bricks_remaining
    - metrics.bricks_total
    - terminal.outcome
    - terminal.isTerminal
