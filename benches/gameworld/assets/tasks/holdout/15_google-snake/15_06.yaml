task_id: "15_06"
game_id: 15_google-snake
evaluator_id: game_api_metric
max_steps: 300
task_target_score_field: 15
task_start_score_field: 0
pause_during_inference: true
continue_on_fail: true

task_prompt: |
  Long-horizon quota task: repeatedly navigate to apples and consume at least 15 apples in one run.
  After each apple is eaten, recover the goal from the updated screen, locate the next apple, and continue the loop without crashing into walls or your own body.

evaluator_config:
  terminal_status: success
  score_field: game_state.score
  end_field: terminal.isTerminal
  metrics_fields:
    - game_state.score
    - gameTimeMs
    - metrics.snake_length
    - metrics.speed
    - metrics.board_width
    - metrics.board_height
    - terminal.outcome
    - terminal.isTerminal
