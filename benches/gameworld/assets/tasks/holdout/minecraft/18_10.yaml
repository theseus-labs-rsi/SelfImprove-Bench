task_id: "18_10"
game_id: 18_minecraft-clone-glm
evaluator_id: game_api_metric
max_steps: 100
task_target_score_field: 3
task_start_score_field: 0
pause_during_inference: true
continue_on_fail: true

task_prompt: |
  Collect at least 3 newly mined dirt blocks during this run.
  Your progress is the number of dirt blocks gained after the run begins.
  Starting inventory items do not count toward this task; only dirt gained after the run begins counts.
  Grass blocks do not count as dirt. If you first target grass, mine or move past it only to expose actual dirt, then mine targeted dirt blocks.
  Look down at nearby ground, line up the crosshair with dirt, and mine each block until collected.

evaluator_config:
  terminal_status: success
  score_field: game_state.inventory.item_gains.dirt
  end_field: terminal.isTerminal
  metrics_fields:
    - game_state.inventory.item_gains.dirt
    - game_state.inventory.item_counts.dirt
    - metrics.collected_positive_total
    - metrics.targeted_block_exists
    - metrics.targeted_block_type
    - metrics.targeted_block_distance
    - metrics.depth_below_surface
    - game_state.environment.break_progress
    - gameTimeMs
    - terminal.outcome
    - terminal.isTerminal
