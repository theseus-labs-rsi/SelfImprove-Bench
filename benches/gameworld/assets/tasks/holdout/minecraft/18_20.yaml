task_id: "18_20"
game_id: 18_minecraft-clone-glm
evaluator_id: game_api_metric
max_steps: 100
task_target_score_field: 8
task_start_score_field: 0
pause_during_inference: true
continue_on_fail: true

task_prompt: |
  Collect at least 8 newly collected wood logs during this run.
  Mine a reachable trunk efficiently. Move to another nearby trunk only if
  the first one cannot provide the remaining quota.

evaluator_config:
  terminal_status: success
  score_field: game_state.inventory.item_gains.wood_log
  end_field: terminal.isTerminal
  metrics_fields:
    - game_state.inventory.item_gains.wood_log
    - metrics.nearby_wood_log_count
    - metrics.targeted_block_type
    - game_state.environment.break_progress
    - terminal.outcome
    - terminal.isTerminal
