task_id: "17_08"
game_id: 17_mario-game
evaluator_id: game_api_metric
max_steps: 100
task_target_score_field: 3
task_start_score_field: 0
pause_during_inference: true
continue_on_fail: true

task_prompt: |
  Collect at least 3 coins in this stage.
  Keep moving right and use jumps to hit coin blocks or reach visible coins.

evaluator_config:
  terminal_status: success
  score_field: metrics.coins
  end_field: terminal.isTerminal
  metrics_fields:
    - game_state.completion_progress
    - game_state.score
    - game_state.level
    - metrics.coins
    - metrics.lives
    - metrics.time_left_s
    - terminal.outcome
    - terminal.isTerminal
    - metrics.level_progress_percent
