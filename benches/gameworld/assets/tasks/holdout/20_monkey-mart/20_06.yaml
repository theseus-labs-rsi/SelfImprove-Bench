task_id: "20_06"
game_id: 20_monkey-mart
evaluator_id: game_api_metric
max_steps: 260
task_target_score_field: 300
task_start_score_field: 0
pause_during_inference: true
continue_on_fail: true

task_prompt: |
  Long-horizon quota task: operate the store efficiently by harvesting bananas and corn, restocking shelves, serving customers, and earning at least 300 coins.
  Keep repeating the harvest-restock-serve loop until the quota is complete.

evaluator_config:
  terminal_status: success
  score_field: metrics.primary_score
  end_field: terminal.isTerminal
  metrics_fields:
    - gameTimeMs
    - game_state.score
    - game_state.money
    - metrics.primary_score
    - game_state.money_total_earned
    - game_state.money_scan_status
    - terminal.outcome
    - terminal.isTerminal
