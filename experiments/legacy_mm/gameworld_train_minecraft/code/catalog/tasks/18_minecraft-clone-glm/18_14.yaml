task_id: "18_14"
game_id: 18_minecraft-clone-glm
evaluator_id: game_api_metric
max_steps: 100
task_target_score_field: 6
task_start_score_field: 0
pause_during_inference: true
continue_on_fail: true

task_prompt: |
  Mine at least 6 newly collected dirt blocks during this run.
  Dirt is the brown block below the green grass surface. Avoid counting
  grass, keep the target centered, and track progress toward the quota.

evaluator_config:
  terminal_status: success
  score_field: game_state.inventory.item_gains.dirt
  end_field: terminal.isTerminal
  metrics_fields:
    - game_state.inventory.item_gains.dirt
    - metrics.targeted_block_type
    - metrics.depth_below_surface
    - game_state.environment.break_progress
    - terminal.outcome
    - terminal.isTerminal
