task_id: "18_h05"
game_id: 18_minecraft-clone-glm
evaluator_id: game_api_metric
max_steps: 100
task_target_score_field: 2
task_start_score_field: 0
pause_during_inference: true
continue_on_fail: true

task_prompt: |
  Secure at least 2 newly collected coal ore blocks in this run.
  Only coal ore gained after the run begins counts; stone does not.
  Search exposed rock or shallow underground areas and verify the targeted
  block type before mining.

evaluator_config:
  terminal_status: success
  score_field: game_state.inventory.item_gains.coal_ore
  end_field: terminal.isTerminal
  metrics_fields:
    - game_state.inventory.item_gains.coal_ore
    - game_state.environment.nearby_resources.coal_ore.count
    - game_state.environment.nearby_resources.coal_ore.nearest_distance
    - metrics.targeted_block_type
    - metrics.targeted_block_distance
    - metrics.depth_below_surface
    - game_state.environment.break_progress
