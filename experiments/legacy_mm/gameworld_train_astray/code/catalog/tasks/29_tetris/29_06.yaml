task_id: "29_06"
game_id: 29_tetris
evaluator_id: game_api_metric
max_steps: 500
task_target_score_field: 600
task_start_score_field: 0
pause_during_inference: true
continue_on_fail: true

task_prompt: |
  Long-horizon quota task: reach at least 600 score while keeping the board playable.
  Place each piece to preserve future line clears; if progress stalls, change the placement strategy instead of repeating ineffective moves.

evaluator_config:
  terminal_status: success
  score_field: game_state.score
  end_field: terminal.isTerminal
  no_progress_patience: 100
  metrics_fields:
    - game_state.score
    - game_state.level
    - game_state.completion_progress
    - metrics.lines_remaining
    - metrics.lines_target
    - terminal.outcome
    - terminal.isTerminal
