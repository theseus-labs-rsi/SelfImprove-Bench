task_id: "02_06"
game_id: 02_another-gentlemans-adventure
evaluator_id: game_api_metric
max_steps: 500
task_target_score_field: 10
task_start_score_field: 0
pause_during_inference: true
continue_on_fail: true

task_prompt: |
  Long-horizon resource quota task: collect at least 10 total coins.
  Coins already collected count toward the quota even if the character dies or the level resets. Keep navigating to collect more coins until the total quota is reached.

evaluator_config:
  terminal_status: success
  score_field: game_state.score
  end_field: terminal.isTerminal
  no_progress_patience: 100
  metrics_fields:
    - game_state.score
    - game_state.completion_progress
    - game_state.level
    - metrics.coins
    - metrics.coins_total
    - metrics.coins_remaining
    - metrics.session_coins_collected
    - terminal.outcome
    - terminal.isTerminal
