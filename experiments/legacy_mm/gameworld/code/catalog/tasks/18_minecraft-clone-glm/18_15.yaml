task_id: "18_15"
game_id: 18_minecraft-clone-glm
evaluator_id: game_api_metric
max_steps: 100
task_target_score_field: 5
task_start_score_field: 0
pause_during_inference: true
continue_on_fail: true

task_prompt: |
  Collect at least 5 newly collected wood logs during this run.
  Find a reachable tree, target its trunk rather than its leaves, and mine
  visible log blocks before moving only when the current trunk is exhausted.

evaluator_config:
  terminal_status: success
  score_field: game_state.inventory.item_gains.wood_log
  end_field: terminal.isTerminal
  metrics_fields:
    - game_state.inventory.item_gains.wood_log
    - game_state.inventory.item_gains.leaves
    - metrics.nearby_wood_log_count
    - metrics.targeted_block_type
    - game_state.environment.break_progress
    - terminal.outcome
    - terminal.isTerminal
