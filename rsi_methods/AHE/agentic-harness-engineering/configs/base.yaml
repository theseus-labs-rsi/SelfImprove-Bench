# Agentic Harness Engineering shared default configuration
# Experiment overlays inherit this file via the _base field and only declare their differences

# ---- Data source (choose path or dataset; see the README "Dataset configuration") ----
# path:    local dataset directory, relative to the AHE root or absolute
# dataset: harbor built-in dataset reference, e.g. "terminal-bench@2.0"
#path: "./dataset/terminal-bench-2"            # example; adjust for your local environment
dataset: "terminal-bench@2.0"               # or switch to a harbor built-in dataset

target_pass_rate: 0.95
max_iterations: 100

# Timeout control (minutes; 0 means unlimited)
harbor_job_timeout_minutes: 0    # timeout for a single harbor evaluation
experiment_timeout_minutes: 0    # total wall-clock timeout for the whole experiment

# LLM configuration: single place for api_key / base_url / model
# Both code_agent and harbor read from here and pass it to ${env.LLM_*} via environment variables
# Set the real values in the experiment overlay or .env; do not hard-code them here
llm:
  api_key: "${LLM_API_KEY}"
  base_url: "${LLM_BASE_URL}"
  model: "gpt-5.4"

harbor:
  agent: "nexau"
  env: "e2b"
  k: 2                                  # number of rollouts per task
  n_concurrent: 64
  force_build: false
  e2b_sandbox_timeout: 3600            # max E2B sandbox lifetime (seconds); overrides E2B_SANDBOX_TIMEOUT in .env

source_config_dir: "agents/code_agent_simple"
agent_config_filename: "code_agent.yaml"

# Best-of-N: each iteration spawns N evolve agents with different strategy
# constraints, evaluates all variants in parallel, and adopts the best one.
# Next iteration's evolve agent sees cross-variant comparison to learn from both.
best_of_n:
  enabled: false
  n: 2
  strategy_hints:
    - "You MUST focus on STRUCTURAL changes: middleware, tool implementations, or sub-agents. Do NOT modify system prompt or skill content this iteration."
    - "You MUST focus on GUIDANCE changes: system prompt rules, skill packages, tool descriptions, or LongTermMEMORY. Do NOT create or modify middleware Python files this iteration."

# Runtime patch for code_agent.yaml (different models need different tool_call_mode / api_type)
code_agent_patch:
  llm_config:
    stream: true

# Patch for the evolve agent, same format as code_agent_patch (applied against the evolve_agent.yaml structure)
# If api_key/base_url/model are not set in llm_config, fall back to the top-level llm
evolve_agent:
  llm_config:
    stream: true

# Patch for explore-agent (deep-merged into each sub-agent's agent.yaml)
# When not set explicitly, api_type / reasoning / tool_call_mode are inherited from evolve_agent
explore_agent_patch:
  llm_config:
    stream: true

# Feishu (Lark) notification: push a message on iteration completion, target reached, or experiment timeout/end
# Add a "custom bot" to the Feishu group chat and put its webhook URL below
notify:
  enabled: true
  feishu_webhook: "${FEISHU_WEBHOOK}"   # https://open.feishu.cn/open-apis/bot/v2/hook/xxxxx

# Explore-Agent: before the experiment, automatically explore source and docs to build knowledge skills for the evolve agent
# Runs in parallel with iteration 1's harbor eval at no extra wall-clock cost
explore_agent:
  enabled: true
  model: null                          # LLM model to use; null inherits the evolve_agent model
  timeout_minutes: 60
                    # explore-agent timeout (on timeout, continue with the skills already produced)

  # Knowledge source: source repositories (source_agent explores framework internals)
  code_sources:
    nexau:
      type: git
      url: "https://github.com/nex-agi/NexAU.git"
      ref: "v0.3.9"
      local_fallback: "../nexau"       # if a local copy exists, use it first (skip clone)

  # Knowledge source: pre-specified web pages (explore-agent must read them)
  # Two groups: environment docs + SOTA coding-agent design research
  web_sources:
    # -- E2B environment docs --
    - url: "https://e2b.dev/docs/sandbox/overview"
      focus: "E2B sandbox lifecycle, preinstalled software, resource limits"
    - url: "https://e2b.dev/docs/sandbox/api"
      focus: "sandbox API: file operations, process management, networking"

    # -- Terminal Bench top-team architecture research (read carefully, extract every technical detail) --
    - url: "https://blog.langchain.dev/how-we-built-the-1-agent-on-terminal-bench/"
      focus: "LangChain deepagents architecture in detail: multi-agent, context management, tool design, and every improvement step and ablation from 52.8% to 66.5%"
    - url: "https://humanlayer.dev/blog/building-coding-agents"
      focus: "HumanLayer harness design in detail: context optimization strategies, hook vs prompt, and the distinction between harness-level and agent-level optimization"
    - url: "https://www.anthropic.com/engineering/claude-code-best-practices"
      focus: "Claude Code best practices in detail: skill system, compaction strategies, hook design, prompt structure, and tool-calling patterns"
    - url: "https://www.anthropic.com/engineering/swe-bench-sonnet"
      focus: "Anthropic SWE-bench technical report: agent architecture, search strategies, editing methods, and ablation results"
    - url: "https://docs.all-hands.dev/modules/usage/architecture"
      focus: "OpenHands/OpenDevin architecture: event stream, AgentController, sandbox integration, and multi-agent coordination"
    - url: "https://aider.chat/docs/leaderboards/"
      focus: "Aider leaderboard: score comparison of different LLMs on coding benchmarks and the effect of edit format"
    - url: "https://www.cognition.ai/blog/devin-terminal-bench"
      focus: "Devin Terminal Bench results and architecture design: long-horizon task handling, environment management, multi-step reasoning"
    - url: "https://terminal-bench.com"
      focus: "Official Terminal Bench page: latest leaderboard, evaluation method, task taxonomy"

# Agent Debugger: before evolve, run LLM analysis of traces via adb ask
# Results are injected into evolution query section 4 to help the evolve agent pinpoint failure root causes
agent_debugger:
  enabled: true
  max_concurrent: 16            # number of parallel adb ask processes (1 process per task, covering all of that task's rollout traces)
  max_tasks: 90                  # max number of tasks to analyze (debug first, summary later)
  timeout_per_task: 600          # adb ask timeout per task (seconds), including the QA agent's multi-turn dialogue
  retry_attempts: 3              # retry count for a failed adb ask within a task (including the first attempt)
  retry_backoff_seconds: 2.0     # seconds to wait before the first retry, then doubling exponentially (similar to the NexAU LLMCaller)

  # Optional: give adb its own LLM; otherwise reuse the LLM_* environment variables
  llm:
    api_key: "${ADB_LLM_API_KEY}"
    base_url: "${ADB_LLM_BASE_URL}"
    model: "gpt-5.4"

post_evolve:
  enabled: false
  datasets:
    - name: "swebench-verified"
      n_concurrent: 24
