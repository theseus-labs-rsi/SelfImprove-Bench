_base: "../base.yaml"
_name: "gpt54"
_description: "GPT-5.4 via the new API"
_tags: ["model-comparison", "gpt54"]

# Use the simple code agent (distinct from the base code_agent directory)
# source_config_dir accepts a relative (to the AHE root) or absolute path
source_config_dir: "agents/code_agent_simple"
agent_config_filename: "code_agent.yaml"

# Override harbor.k in base (number of rollouts per task)
harbor:
  k: 2
  n_concurrent: 96

llm:
    api_key: "${GPT54_LLM_API_KEY}"
    base_url: "${GPT54_LLM_BASE_URL}"
    model: "gpt-5.4"

code_agent_patch:
  tool_call_mode: openai
  llm_config:
    api_type: openai_responses
    reasoning:
      effort: "high"
      summary: "detailed"

evolve_agent:
  tool_call_mode: openai
  llm_config:
    api_key: "${GPT54_LLM_API_KEY}"
    base_url: "${GPT54_LLM_BASE_URL}"
    model: "gpt-5.4"
    api_type: openai_responses
    reasoning:
      effort: "xhigh"
      summary: "detailed"

explore_agent_patch:
  tool_call_mode: openai
  llm_config:
    api_type: openai_responses
    reasoning:
      effort: "xhigh"
      summary: "detailed"
