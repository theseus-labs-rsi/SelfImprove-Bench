[backend.openai]
api_key_env = "OPENAI_API_KEY"
base_url_env = "OPENAI_BASE_URL"
api_mode = "responses"

[state]
# Parent only; every init creates a new run_<uuid> workspace below it.
workspace_root = "../../../outputs/hyperagents"
# Optional explicit template source; empty uses the bundled HyperAgents source.
initial_source = ""

[meta_agent]
backend = "openai"
model = "gpt-5.6-sol-r1-staff"
reasoning_effort = "medium"
max_output_tokens = 8192

[task_agent]
backend = "openai"
model = "gpt-5.6-sol-r1-staff"
reasoning_effort = "medium"
max_output_tokens = 4096

[refine]
max_refinement_rounds = 1
